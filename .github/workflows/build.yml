# Tests Lingua, then builds the web app, Android (APK + Play bundle) and iOS (device archive + simulator app).
# Builds are attached to the pre-release "build-<version>". Android is signed in CI only when the
# LINGUA_KEYSTORE_* secrets exist; otherwise the release APK/AAB are unsigned and signed afterwards.
name: Test and build

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - name: Unit tests
        run: npm test
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests (desktop and mobile Chromium)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-report, path: app/playwright-report, retention-days: 14 }

  web:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package the web app (PWA)
        run: |
          V=$(node -p "require('./app/package.json').version")
          mkdir -p dist && (cd app/www && zip -qr "../../dist/lingua-$V-web.zip" .)
      - uses: actions/upload-artifact@v4
        with: { name: web, path: dist/ }

  android:
    needs: test
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: app } }
    env:
      HAS_KEY: ${{ secrets.LINGUA_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: npm ci && npx cap sync android
      - name: Use the release key (only when the secrets are set)
        if: env.HAS_KEY == 'true'
        run: |
          echo "${{ secrets.LINGUA_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/lingua-release.jks"
          echo "LINGUA_KEYSTORE_FILE=$RUNNER_TEMP/lingua-release.jks" >> "$GITHUB_ENV"
          echo "LINGUA_KEYSTORE_PASSWORD=${{ secrets.LINGUA_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "LINGUA_KEY_ALIAS=${{ secrets.LINGUA_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "LINGUA_KEY_PASSWORD=${{ secrets.LINGUA_KEY_PASSWORD }}" >> "$GITHUB_ENV"
      - name: Build release APK and Play bundle
        working-directory: app/android
        run: ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Collect outputs
        run: |
          V=$(node -p "require('./package.json').version"); S=$([ "$HAS_KEY" = true ] && echo signed || echo unsigned)
          mkdir -p ../dist
          cp "$(ls android/app/build/outputs/apk/release/*.apk | head -1)" "../dist/lingua-$V-android-$S.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "../dist/lingua-$V-android-$S.aab"
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with: { name: android, path: dist/ }

  ios:
    needs: test
    runs-on: macos-15
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci && npx cap sync ios
      - name: Archive for devices (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Lingua.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive | tail -20
      - name: Build for the iOS Simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/sim" build | tail -20
      - name: Launch test on an iPhone simulator
        run: |
          bash tools/ios-smoke.sh "$RUNNER_TEMP/sim/Build/Products/Release-iphonesimulator/App.app"
          mkdir -p ../dist && cp smoke/*.png ../dist/
      - name: Package
        run: |
          V=$(node -p "require('./package.json').version"); mkdir -p ../dist "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/Lingua.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/dist/lingua-$V-ios-unsigned.ipa" Payload)
          (cd "$RUNNER_TEMP/sim/Build/Products/Release-iphonesimulator" && zip -qry "$GITHUB_WORKSPACE/dist/lingua-$V-ios-simulator.zip" App.app)
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: dist/ }

  android-device:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: cd app && npm ci && npx cap sync android
      - name: Build a debug APK for the emulator
        working-directory: app/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Launch test on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash app/tools/android-smoke.sh
      - run: mkdir -p dist && cp smoke/*.png dist/ && cp smoke/android-logcat.txt dist/
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke-android, path: dist/ }

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: app/desktop, shell: bash } }
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/desktop/package-lock.json }
      - run: npm ci
      - name: Launch test (opens Lingua, checks brand, tabs and footer, no errors)
        run: npx electron . --smoke
      - name: Build the installer
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then T=dist:win; else T=dist:mac; fi
          set +e; npm run $T > build.log 2>&1; rc=$?; set -e; tail -40 build.log
          [ $rc -eq 0 ] || { echo "::error title=Installer build::$(grep -iE 'error|failed|⨯' build.log | tail -6 | tr '\n' ' ')"; exit 1; }
          shopt -s nullglob; files=(dist/*.exe dist/*.dmg)
          [ ${#files[@]} -gt 0 ] || { echo "::error title=Installer build::no installer in dist: $(ls dist | tr '\n' ' ')"; exit 1; }
          mkdir -p ../../dist && cp "${files[@]}" ../../dist/ && ls -la ../../dist
      - uses: actions/upload-artifact@v4
        with: { name: "desktop-${{ runner.os }}", path: dist/ }

  publish:
    needs: [web, android, ios, android-device, desktop]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dl }
      - name: Attach builds to the build pre-release
        run: |
          V=$(node -p "require('./app/package.json').version")
          mkdir -p dist && cp dl/web/* dl/android/* dl/ios/* dl/smoke-android/*.png dl/desktop-*/* dist/
          # One install package: signed Android builds from releases/, everything else from this build.
          P="pkg/lingua-$V-install"; mkdir -p "$P"
          cp releases/v$V/lingua-$V-android.apk releases/v$V/lingua-$V-android.aab releases/v$V/INSTALL.md releases/v$V/qr-*.png "$P/" 2>/dev/null || true
          cp dist/lingua-$V-ios-unsigned.ipa dist/lingua-$V-web.zip dist/*.exe dist/*.dmg "$P/"
          (cd "$P" && sha256sum lingua-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
          (cd pkg && zip -qr "../dist/lingua-$V-install-package.zip" "lingua-$V-install")
          (cd dist && sha256sum lingua-* > SHA256SUMS.txt)
          cat "$P/SHA256SUMS.txt" >> dist/SHA256SUMS.txt; sort -u -k2 dist/SHA256SUMS.txt -o dist/SHA256SUMS.txt
          V=$(node -p "require('./app/package.json').version"); TAG="build-$V"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
            --title "Lingua $V — CI build" --notes "Automatic builds of Lingua $V from GitHub Actions. Unsigned builds are signed before the final release."
          gh release upload "$TAG" dist/* --clobber
          echo "Built from $GITHUB_SHA (run $GITHUB_RUN_ID)" > dist/BUILD_INFO.txt && gh release upload "$TAG" dist/BUILD_INFO.txt --clobber
