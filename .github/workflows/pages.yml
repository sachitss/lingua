# Publishes the web app (app/www) to the gh-pages branch, served at https://sachitss.github.io/lingua/.
name: Publish web app

on:
  push:
    branches: [main]
    paths: ["app/www/**", ".github/workflows/pages.yml"]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Push app/www to gh-pages
        run: |
          cd app/www
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web app from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
