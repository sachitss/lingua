# Publishes each releases/vX.Y.Z folder as a GitHub Release with the files in it.
name: Publish releases

on:
  push:
    branches: [main]
    paths: ["releases/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Create or update the releases
        run: |
          for dir in releases/v*/; do
            tag=$(basename "$dir"); notes="$dir/RELEASE_NOTES.md"
            [ -f "$notes" ] || continue
            title=$(head -1 "$notes" | sed 's/^# *//')
            files=$(find "$dir" -maxdepth 1 -type f ! -name RELEASE_NOTES.md ! -name FROM_BUILD | sort)
            # Builds that stay out of git (iOS, web) are copied from the CI pre-release build-<version>.
            if [ -f "$dir/FROM_BUILD" ]; then
              mkdir -p "fetched/$tag"
              for f in $(grep -v '^#' "$dir/FROM_BUILD"); do
                gh release download "build-${tag#v}" -p "$f" -D "fetched/$tag" --clobber
              done
              files="$files $(find "fetched/$tag" -type f | sort)"
            fi
            pre=""; case "$tag" in v0.*) pre="--prerelease";; esac
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --title "$title" --notes-file "$notes"
            else
              gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file "$notes" $pre
            fi
            [ -n "$files" ] && gh release upload "$tag" $files --clobber
          done
